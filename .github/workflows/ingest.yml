# Data ingest (plan §8.1, §8.3). Pulls raw public data at authoring time, rebuilds the datasets and
# opens a pull request with the diff. Nothing is fetched by the client at run time.
#
# Scheduled once a year for the January market-history refresh. Run it by hand for the other items on
# the calendar in docs/runbooks/annual-data-update.md.
name: Data ingest

on:
  workflow_dispatch:
    inputs:
      market:
        description: Refresh market history (Shiller, FRED, Damodaran) and rebuild market/*.json
        type: boolean
        default: true
      slcsp_year:
        description: Plan year for the ACA benchmark (SLCSP) ingest, e.g. 2028. Leave empty to skip.
        type: string
        default: ''
  schedule:
    # 09:00 UTC on 15 January, when the sources carry the prior year's figures.
    - cron: '0 9 15 1 *'

permissions:
  contents: read

concurrency:
  group: data-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      RUN_MARKET: ${{ github.event_name == 'schedule' || inputs.market }}
      SLCSP_YEAR: ${{ inputs.slcsp_year }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Check inputs
        run: |
          if [ -n "$SLCSP_YEAR" ] && ! printf '%s' "$SLCSP_YEAR" | grep -Eq '^20[0-9]{2}$'; then
            echo "::error::slcsp_year must be a four-digit year, got: $SLCSP_YEAR"
            exit 1
          fi

      - name: Shiller
        if: ${{ env.RUN_MARKET == 'true' }}
        run: pnpm exec tsx tools/ingest/shiller.ts

      # The only step that sees FRED_API_KEY (plan §14.2).
      - name: FRED
        if: ${{ env.RUN_MARKET == 'true' }}
        run: pnpm exec tsx tools/ingest/fred.ts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Damodaran
        if: ${{ env.RUN_MARKET == 'true' }}
        run: pnpm exec tsx tools/ingest/damodaran.ts

      - name: Build market datasets
        if: ${{ env.RUN_MARKET == 'true' }}
        run: pnpm exec tsx tools/ingest/build-market.ts

      - name: ACA benchmark premiums (SLCSP)
        if: ${{ env.SLCSP_YEAR != '' }}
        run: pnpm exec tsx tools/ingest/slcsp.ts "$SLCSP_YEAR"

      - name: Validate datasets
        run: pnpm validate:data

      - name: Open a pull request with the data diff
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/ingest-${{ github.run_id }}
          add-paths: packages/data
          commit-message: 'data: ingest refresh'
          title: 'data: ingest refresh'
          delete-branch: true
          body: |
            Automated ingest run ${{ github.run_id }} (${{ github.event_name }}).

            - Market history refreshed: `${{ env.RUN_MARKET }}`
            - SLCSP plan year: `${{ env.SLCSP_YEAR || 'not run' }}`

            Before merging, follow `docs/runbooks/annual-data-update.md`:

            1. Read the diff against the prior data (values, `retrieved`, `sha256`).
            2. Set `status` (`enacted` or `projected`) and `lawRefs` where they changed.
            3. Close and reopen this PR so CI runs. PRs opened with the workflow token do not trigger it.
            4. After merge, tag the data release `data-YYYY.N`.

      - name: Summary
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "Opened or updated: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No data changes, so no pull request was opened." >> "$GITHUB_STEP_SUMMARY"
          fi
