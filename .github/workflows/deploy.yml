# Production deploy (plan §14.2): on every push to main, run the full CI chain, then ship.
#
# Order: D1 migrations -> Worker -> Pages. Migrations go first so the new Worker never runs against
# an old schema. That requires every migration to be backward compatible with the Worker that is
# still live (expand now, contract in a later release). See docs/runbooks/release-and-rollback.md.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a deploy half way; queue the next one behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PAGES_PROJECT: ek-fi-sim
  # D1 database names as created in docs/runbooks/cloudflare-setup.md. They must match
  # workers/sync/wrangler.toml ([env.preview] and [env.production] d1_databases.database_name).
  D1_DATABASE_PREVIEW: fisim-sync-preview
  D1_DATABASE_PRODUCTION: fisim-sync-production

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    # ci.yml's preview job declares deployments: write. It is skipped on push, but a called workflow
    # may not request more than its caller grants, so the permission has to be granted here.
    permissions:
      contents: read
      deployments: write

  # Until Cloudflare is set up (docs/runbooks/cloudflare-setup.md) the repository has no API token. Then the
  # deploy jobs are skipped with a notice instead of failing every push to main; the checks still run.
  cloudflare:
    name: Cloudflare credentials
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.cf.outputs.ready }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "ready=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::notice::Deploy skipped: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."
          fi

  deploy-sync-preview:
    name: Sync Worker (preview env)
    needs: [checks, cloudflare]
    if: needs.cloudflare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The preview environment gets the change first, as a canary for the migration and the Worker.
      - name: Apply D1 migrations (preview)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/sync
          command: d1 migrations apply ${{ env.D1_DATABASE_PREVIEW }} --env preview --remote
      - name: Deploy the Worker (preview)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/sync
          command: deploy --env preview

  deploy-sync-production:
    name: Sync Worker (production)
    needs: deploy-sync-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/sync
          command: d1 migrations apply ${{ env.D1_DATABASE_PRODUCTION }} --env production --remote
      - name: Deploy the Worker (production)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/sync
          command: deploy --env production

  deploy-pages-production:
    name: Pages (production)
    needs: deploy-sync-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The exact artifact that passed the checks job.
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy to Cloudflare Pages (production)
        id: pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: workers/sync
          command: >-
            pages deploy ../../apps/web/dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
      - name: Report the deployment
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Pages deployment: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
