# Public site deployment: checks -> D1 migrations -> exact checked Pages artifact.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PAGES_PROJECT: longview-planner

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      deployments: write

  cloudflare:
    name: Cloudflare credentials
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.cf.outputs.ready }}
    steps:
      - name: Check for Cloudflare credentials
        id: cf
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "ready=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::notice::Publication skipped: configure the Cloudflare repository secrets or publish manually with Wrangler."
          fi

  deploy-pages-production:
    name: Pages and private cloud storage
    needs: [checks, cloudflare]
    if: needs.cloudflare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Download checked build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - name: Apply backward-compatible D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/sync
          command: d1 migrations apply longview-planner --remote --config ../../apps/web/wrangler.toml
      - name: Publish Pages and account API
        id: pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: workers/sync
          command: >-
            pages deploy dist --cwd ../../apps/web
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main --commit-hash=${{ github.sha }}
      - name: Report deployment
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
        run: echo "Published ${DEPLOYMENT_URL} from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
